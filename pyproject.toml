[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "teslasuit_rapidkit"
version = "0.1.0"
description = "Rapid closed-loop FES application framework for Teslasuit"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ulazislau Mitskevich", email = "u.mitskevich@teslasuit.io" },
    { name = "Raman Teush", email = "r.teush@teslasuit.io" },
]
keywords = ["fes", "teslasuit", "closed-loop", "electrical-stimulation", "rehabilitation", "biosignal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "numpy>=1.24",
    "pylsl>=1.16",
]

[project.urls]
Homepage = "https://documentation.teslasuit.io/frameworks"
Repository = "https://github.com/teslasuit/RapidKit"
Issues = "https://github.com/teslasuit/RapidKit/issues"

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["teslasuit_rapidkit*"]

[tool.setuptools.package-data]
teslasuit_rapidkit = ["config/*.json"]
